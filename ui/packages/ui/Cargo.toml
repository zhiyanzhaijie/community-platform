[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { workspace = true, features = ["router", "fullstack"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
dioxus-fullstack = { workspace = true, optional = true }
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }
urlencoding = "2.1.3"
serde_json = "1.0.145"

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:reqwest", "dep:dioxus-fullstack"]
